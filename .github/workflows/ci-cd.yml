name: Travel Job CI/CD
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3-6
        env:
          POSTGRES_DB: travel_job_test
          POSTGRES_USER: travel_job_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel_job_test -d travel_job_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: travel_job_test
      DATABASE_USERNAME: travel_job_test
      DATABASE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build executable JAR
        run: bash ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: build/libs
      - id: image
        name: Resolve image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

